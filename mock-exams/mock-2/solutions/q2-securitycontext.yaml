# q2 정답 — immutable worker
# 적용: kubectl apply -f solutions/q2-securitycontext.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: m2-sc
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 30000
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
