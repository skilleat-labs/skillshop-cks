# ============================================================
# CKS 모의고사 3회차 — 클러스터 리소스 문제 환경 (q1 앱, q3, q4, q6)
# 적용:  kubectl apply -f setup.yaml
# q1 PeerAuthentication(Istio) 은 Istio 설치 필요 → 여기선 앱만 생성.
# q2(Secrets 암호화)·q5(kubelet 하드닝) 은 노드 작업.
# ============================================================

# ---------- q1. Istio mTLS 대상 앱 · ns m3-istio ----------
apiVersion: v1
kind: Namespace
metadata:
  name: m3-istio
  # 현재: sidecar injection 라벨 없음 — istio-injection=enabled 를 붙여야 함
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: m3-istio
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
# ---------- q3. PSS 네임스페이스 강제 · ns m3-pss ----------
apiVersion: v1
kind: Namespace
metadata:
  name: m3-pss
  # 현재: 아무 PSS 라벨 없음 — enforce=restricted + warn=restricted 를 붙여야 함
---
# ---------- q4. 참조된 secretName 에 맞춰 TLS Secret 생성 · ns m3-tls ----------
apiVersion: v1
kind: Namespace
metadata:
  name: m3-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: m3-tls
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: m3-tls
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 80 }]
---
# Ingress 에 이미 secretName: api-tls 가 지정돼 있으나 그 Secret 이 없다 → 정확히 같은 이름으로 만들어야 함
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: m3-tls
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.m3.example.com"]
      secretName: api-tls
  rules:
    - host: api.m3.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
---
# ---------- q6. Falco 탐지 대상 워크로드 · ns m3-falco ----------
apiVersion: v1
kind: Namespace
metadata:
  name: m3-falco
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suspicious
  namespace: m3-falco
spec:
  replicas: 1
  selector:
    matchLabels: { app: suspicious }
  template:
    metadata:
      labels: { app: suspicious }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # /dev/mem 접근을 반복 시도하는 악성 흉내 (탐지 대상)
          command: ["sh", "-c", "while true; do head -c 16 /dev/mem 2>/dev/null; sleep 5; done"]
          securityContext:
            privileged: true
