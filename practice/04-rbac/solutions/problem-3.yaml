# 문제 3 정답 — SA·Pod 양쪽에서 토큰 자동마운트 off
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot
  namespace: rbac-ex3
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: rbac-ex3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: robot
      automountServiceAccountToken: false   # Pod 레벨이 최종 우선
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
