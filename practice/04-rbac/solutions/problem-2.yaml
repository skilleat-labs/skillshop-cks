# 문제 2 정답 — reader 최소 권한 + 토큰 자동마운트 off
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: rbac-ex2
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-viewer
  namespace: rbac-ex2
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-rb
  namespace: rbac-ex2
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: rbac-ex2
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
