# 4강 RBAC 실습 — 시작 상태
---
apiVersion: v1
kind: Namespace
metadata: { name: rbac-ex1 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: app-sa, namespace: rbac-ex1 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: app-role, namespace: rbac-ex1 }
rules:
  - apiGroups: ["*"]          # 과도한 권한 (모든 것 허용)
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: app-rb, namespace: rbac-ex1 }
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: rbac-ex1
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Namespace
metadata: { name: rbac-ex2 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: reader, namespace: rbac-ex2 }
