apiVersion: v1
kind: Namespace
metadata:
  name: rbac-ex4
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy
  namespace: rbac-ex4
---
# 과도한 권한: legacy SA 가 이 네임스페이스에서 cluster-admin 을 갖는다
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dangerous-admin
  namespace: rbac-ex4
subjects:
  - kind: ServiceAccount
    name: legacy
    namespace: rbac-ex4
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
