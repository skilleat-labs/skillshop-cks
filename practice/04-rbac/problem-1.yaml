apiVersion: v1
kind: Namespace
metadata:
  name: rbac-ex1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: rbac-ex1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: rbac-ex1
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rb
  namespace: rbac-ex1
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: rbac-ex1
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
