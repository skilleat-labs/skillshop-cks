apiVersion: v1
kind: Namespace
metadata:
  name: rbac-ex6
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: rbac-ex6
---
# 과도한 권한: ci-bot 이 ClusterRoleBinding 으로 클러스터 전체 cluster-admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-bot-admin
subjects:
  - kind: ServiceAccount
    name: ci-bot
    namespace: rbac-ex6
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
