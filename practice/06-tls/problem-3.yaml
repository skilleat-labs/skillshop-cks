# 문제 3 환경 — Ingress 에 secretName(api-tls)이 이미 지정돼 있으나 그 Secret 은 아직 없음
apiVersion: v1
kind: Namespace
metadata:
  name: tls-ex2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tls-ex2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tls-ex2
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: tls-ex2
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls          # 이미 지정됨 → 이 이름의 Secret 을 만들어야 함 (현재 없음)
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
