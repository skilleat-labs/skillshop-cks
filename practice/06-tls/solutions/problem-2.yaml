# 문제 2 정답 — TLS + ssl-redirect 적용 Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: tls-ex
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: shop-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
