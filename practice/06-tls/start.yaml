# 6강 TLS + Ingress 실습 — 시작 상태 (ingress-nginx 컨트롤러 필요)
---
apiVersion: v1
kind: Namespace
metadata: { name: tls-ex }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: shop, namespace: tls-ex }
spec:
  replicas: 1
  selector: { matchLabels: { app: shop } }
  template:
    metadata: { labels: { app: shop } }
    spec:
      containers: [{ name: nginx, image: nginx:1.27-alpine, ports: [{ containerPort: 80 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: shop, namespace: tls-ex }
spec:
  selector: { app: shop }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: tls-ex }      # 지금은 HTTP만 (TLS 없음)
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: shop, port: { number: 80 } } }
