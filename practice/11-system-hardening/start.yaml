# 11강 System Hardening 실습 — seccomp 문제용 워크로드 (ns sys-ex)
---
apiVersion: v1
kind: Namespace
metadata: { name: sys-ex }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: sys-ex }
spec:
  replicas: 1
  selector: { matchLabels: { app: app } }
  template:
    metadata: { labels: { app: app } }
    spec:                              # seccomp 프로파일 없음 → 추가해야 함
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
