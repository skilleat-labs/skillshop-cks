# 문제 1 정답 — seccomp RuntimeDefault
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: sys-ex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
