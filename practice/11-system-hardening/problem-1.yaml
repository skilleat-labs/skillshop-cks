apiVersion: v1
kind: Namespace
metadata:
  name: sys-ex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: sys-ex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
