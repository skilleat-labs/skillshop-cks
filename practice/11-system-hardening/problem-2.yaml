# 문제 2 (AppArmor) — 준비된 매니페스트. 이 파일을 "수정"해서 프로파일을 적용하라.
#   시험 방식: 주어진 매니페스트에 securityContext.appArmorProfile 을 추가한다.
#   ⚠️ 먼저 worker 노드에 프로파일을 로드하고, aa-status 로 "프로파일 이름"을 확인할 것.
#      (파일명 k8s-apparmor-deny-write 가 아니라, 파일 안 'profile very-secure' 의 very-secure)
#
#   적용:  kubectl apply -f problem-2.yaml
#   ns 는 problem-1.yaml 이 만든 sys-ex 를 재사용 (없으면 먼저 problem-1.yaml apply)
apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: sys-ex
  labels:
    app: secure-pod
spec:
  # TODO: 아래에 securityContext.appArmorProfile 을 추가하라 (type: Localhost, localhostProfile: <프로파일 이름>)
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
