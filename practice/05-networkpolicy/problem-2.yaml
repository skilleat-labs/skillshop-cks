apiVersion: v1
kind: Namespace
metadata:
  name: netpol-ex2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: netpol-ex2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tester
  template:
    metadata:
      labels:
        app: tester
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
