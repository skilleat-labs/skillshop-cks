# 5강 NetworkPolicy 실습 — 시작 상태 (NetworkPolicy 강제하는 CNI 필요: Calico/Cilium)
---
apiVersion: v1
kind: Namespace
metadata: { name: netpol-ex1 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: netpol-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers: [{ name: nginx, image: nginx:1.27-alpine, ports: [{ containerPort: 80 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: netpol-ex1 }
spec:
  selector: { app: db }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: netpol-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers: [{ name: app, image: busybox:1.36, command: ["sh","-c","sleep 3600"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: attacker, namespace: netpol-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: attacker } }
  template:
    metadata: { labels: { app: attacker } }
    spec:
      containers: [{ name: app, image: busybox:1.36, command: ["sh","-c","sleep 3600"] }]
---
apiVersion: v1
kind: Namespace
metadata: { name: netpol-ex2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tester, namespace: netpol-ex2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: tester } }
  template:
    metadata: { labels: { app: tester } }
    spec:
      containers: [{ name: app, image: busybox:1.36, command: ["sh","-c","sleep 3600"] }]
