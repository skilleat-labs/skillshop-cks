# 문제 3 환경 — Cilium mutual auth (Cilium CNI + authentication 기능 필요)
apiVersion: v1
kind: Namespace
metadata:
  name: cnp-ex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
  namespace: cnp-ex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: target
  namespace: cnp-ex
spec:
  selector:
    app: target
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnp-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: cnp-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
