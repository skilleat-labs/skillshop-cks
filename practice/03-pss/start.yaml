# 3강 PSS 실습 — 시작 상태
---
apiVersion: v1
kind: Namespace
metadata:
  name: pss-ex1
  labels:
    pod-security.kubernetes.io/enforce: restricted   # 이미 restricted 강제 중
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: pss-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:                                  # restricted 요건 미충족 → 파드 생성 거부됨
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Namespace
metadata: { name: pss-ex2 }                # 레이블 아직 없음
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: pss-ex2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: app } }
  template:
    metadata: { labels: { app: app } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
