apiVersion: v1
kind: Namespace
metadata:
  name: sc-ex3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: sc-ex3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # /data 에 로그를 쓴 뒤 대기. 루트FS 읽기전용이라 지금은 크래시한다.
          command:
            - sh
            - -c
            - echo started > /data/app.log && sleep 3600
          securityContext:
            readOnlyRootFilesystem: true
