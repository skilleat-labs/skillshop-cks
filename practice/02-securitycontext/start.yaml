# 2강 SecurityContext 실습 — 시작 상태(전부 무방비)
# 적용:  kubectl apply -f start.yaml
# 문제는 README.md, 정답은 solutions/ 참고
---
apiVersion: v1
kind: Namespace
metadata: { name: sc-ex1 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: sc-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Namespace
metadata: { name: sc-ex2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: sc-ex2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Namespace
metadata: { name: sc-ex3 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: writer, namespace: sc-ex3 }
spec:
  replicas: 1
  selector: { matchLabels: { app: writer } }
  template:
    metadata: { labels: { app: writer } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # /data 에 로그를 쓴 뒤 대기. 그런데 루트FS가 읽기전용이라 지금은 크래시한다.
          command: ["sh", "-c", "echo started > /data/app.log && sleep 3600"]
          securityContext:
            readOnlyRootFilesystem: true
