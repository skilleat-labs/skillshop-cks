apiVersion: v1
kind: Namespace
metadata:
  name: sc-ex1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sc-ex1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
