# 문제 1 정답 — non-root 실행 (ns: sc-ex1)
# 적용: kubectl apply -f solutions/problem-1.yaml   (또는 kubectl edit deploy/api -n sc-ex1)
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: sc-ex1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext:          # 파드 레벨
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
