# 문제 2 정답 — immutable 컨테이너 (ns: sc-ex2)
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: sc-ex2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          securityContext:                 # 컨테이너 레벨 (이 3개는 컨테이너 전용)
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
