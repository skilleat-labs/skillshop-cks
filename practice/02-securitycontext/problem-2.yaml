apiVersion: v1
kind: Namespace
metadata:
  name: sc-ex2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sc-ex2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
