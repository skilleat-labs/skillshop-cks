name: Build and push images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NS: skilleat            # Docker Hub 네임스페이스

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, product-svc, order-svc, payment-svc]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push — vulnerable (1.0)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.NS }}/skillshop-${{ matrix.service }}:1.0
            ${{ env.NS }}/skillshop-${{ matrix.service }}:vulnerable

      - name: Build & push — hardened (2.0)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile.hardened
          push: true
          tags: |
            ${{ env.NS }}/skillshop-${{ matrix.service }}:2.0
            ${{ env.NS }}/skillshop-${{ matrix.service }}:hardened
